
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo">NETFLIX</h1>
    <input id="search" placeholder="Search movies...">
  </header>

  <section class="hero">
    <div>
      <h1>Unlimited Movies</h1>
      <p>Discover movies and entertainment.</p>
      <button onclick="loadMovies()">Explore Movies</button>
    </div>
  </section>

  <main>
    <h2>Popular Movies</h2>
    <div id="movies" class="movie-grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
