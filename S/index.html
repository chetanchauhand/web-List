<section class="nasa-section">
    <div class="nasa-heading">
        <span>NASA DATABASE</span>
        <h2>Explore The Universe</h2>
        <p>Real space images from NASA's image library.</p>
    </div>

    <div class="nasa-search">
        <select id="planetSelect">
            <option value="Mercury planet">Mercury</option>
            <option value="Venus planet">Venus</option>
            <option value="Earth planet">Earth</option>
            <option value="Mars planet">Mars</option>
            <option value="Jupiter planet">Jupiter</option>
            <option value="Saturn planet">Saturn</option>
            <option value="Uranus planet">Uranus</option>
            <option value="Neptune planet">Neptune</option>
            <option value="Sun NASA">Sun</option>
        </select>

        <button id="nasaSearchBtn">Explore</button>
    </div>

    <p id="nasaStatus">Select a planet to explore NASA images.</p>
    <div id="nasaGallery" class="nasa-gallery"></div>
</section>

<script src="nasa.js"></script>
